include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    # תיעוד חסר על API ציבורי הוא אזהרה שנצברת ומאבדת משמעות; ההערות כאן
    # מוקדשות ל"למה", לא ל"מה".
    public_member_api_docs: ignore
  exclude:
    - build/**
    # ‏`app/` היא חבילה נפרדת עם pubspec ו-analysis_options משלה.
    - app/**

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - prefer_final_locals
    - unawaited_futures
