name: otzaria_subset_app
description: >-
  ממשק המשתמש למנוע הספרייה החלקית: בחירת ספרים, בנייה, עדכון ואימות.
  המנוע עצמו יושב ב-`otzaria_subset` ונשאר חבילת לוגיקה בלי תלות ב-UI.
publish_to: none
version: 0.1.3
environment:
  sdk: ">=3.2.6 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  otzaria_subset:
    path: ../
  # נעוץ לאותו commit כמו ב-pubspec.yaml שבשורש — ראו ההערה שם.
  seforim_library_updater:
    git:
      url: https://github.com/Otzaria/Otzaria_Offline_update.git
      ref: 17bb5c599fe766fa27a0b3261f2639a8d9bb7e89
  # אימות ה-SHA-256 של העדכון העצמי לפני שמריצים אותו. הייתה זמינה
  # טרנזיטיבית, אבל תלות ישירה לא נעלמת כשחבילה אחרת משנה תלויות.
  crypto: ^3.0.6
  ffi: ^2.1.3
  file_selector: ^1.0.3
  http: ^1.2.2
  hive_ce: ^2.19.3
  # איתור המסד וההגדרות של אוצריא מגיע משם ולא משוכפל כאן: הוא קורא
  # את קופסת ה-Hive שלה ומכיר גם התקנה ניידת והתקנת מנהל.
  library_manager:
    git:
      url: https://github.com/Otzaria/Otzaria_Offline_update.git
      path: library_manager
      ref: 17bb5c599fe766fa27a0b3261f2639a8d9bb7e89
  path: ^1.9.1
  path_provider: ^2.1.4
  sqlite3: ^3.3.3
  sqlite3_flutter_libs: ^0.5.24
  # פתיחת פנייה בגיטהאב בדפדפן — ShellExecute דרך הפלאגין, ולא הרכבת
  # שורת פקודה שמקלקלת כתובת עם פרמטרים מקודדים.
  url_launcher: ^6.3.1
  # ‏zstandard מביא את ה-DLL ליד ה-exe; zstandard_native הוא ה-FFI הטהור
  # שמעליו בנוי הפירוק בהזרמה.
  zstandard: ^1.3.26
  zstandard_native: ^1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
