name: otzaria_subset
description: >-
  מנוע ספרייה חלקית לאוצריא: בונה תת-קבוצה של seforim.db לפי בחירת ספרים
  וקטגוריות, מסנן קובצי patch לאותה תת-קבוצה, ומאמת את התוצאה מול hash
  לוגי חלקי משלו.
version: 0.1.2
publish_to: none

environment:
  sdk: ">=3.2.6 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  # ‏PatchApplier ו-LogicalContentHasher באים משם ולא משוכפלים לכאן: הם
  # תרגום בית-בית של הצד הקוטליני, וכפילות שלהם תיסחף ממנו בשקט.
  # נעוץ ל-commit: שכפול של HEAD היה שובר את הבנייה בשקט על כל שינוי שם.
  # עדכון התלות הוא החלפת ה-ref כאן וב-app/pubspec.yaml יחד.
  seforim_library_updater:
    git:
      url: https://github.com/Otzaria/Otzaria_Offline_update.git
      ref: 17bb5c599fe766fa27a0b3261f2639a8d9bb7e89
  meta: ^1.18.0
  path: ^1.9.1
  sqlite3: ^3.3.3
  sqlite3_flutter_libs: ^0.5.24

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.30.1
  flutter_lints: ^4.0.0

flutter:
  # חבילת לוגיקה טהורה — אין assets ואין widgets. הסעיף מסמן אותה
  # כ-Flutter package לכלי ה-pub/IDE.
